[package]
name = "data-encoding-v3"
version = "0.1.3-git"
license = "MIT"
edition = "2024"
rust-version = "1.85"
keywords = ["no_std", "base64", "base32", "hex"]
categories = ["encoding", "no-std"]
readme = "README.md"
repository = "https://github.com/ia0/data-encoding"
documentation = "https://docs.rs/data-encoding"
description = "Development branch of data-encoding 3.0.0"
include = ["Cargo.toml", "LICENSE", "README.md", "src/lib.rs"]

# TODO(https://github.com/rust-lang/rust/issues/43781): Remove this once doc_auto_cfg is in the MSRV.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg=docsrs"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lints]
rust.elided_lifetimes_in_paths = "warn"
rust.let_underscore_drop = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_results = "warn"
clippy.pedantic = { level = "warn", priority = -1 }
clippy.assigning_clones = "allow"
clippy.doc_markdown = "allow"
clippy.enum_glob_use = "allow"
clippy.match_bool = "allow"
clippy.semicolon_if_nothing_returned = "allow"
clippy.similar_names = "allow"
