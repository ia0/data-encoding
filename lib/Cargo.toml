[package]
name = "data-encoding"
version = "2.11.2-git"
license = "MIT"
edition = "2018"
rust-version = "1.48"
keywords = ["no_std", "base64", "base32", "hex"]
categories = ["encoding", "no-std"]
readme = "README.md"
repository = "https://github.com/ia0/data-encoding"
documentation = "https://docs.rs/data-encoding"
description = "Efficient and customizable data-encoding functions like base64, base32, and hex"
include = ["Cargo.toml", "LICENSE", "README.md", "src/lib.rs"]

# TODO: Remove this (and its lib and xtask counterpart) once doc_cfg is in the MSRV.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg=docsrs"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lints]
clippy.undocumented_unsafe_blocks = "warn"
rust.elided_lifetimes_in_paths = "warn"
rust.let_underscore_drop = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unsafe_op_in_unsafe_fn = "warn"
rust.unused_results = "warn"
